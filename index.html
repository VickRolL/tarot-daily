<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08050f" />
    <title>今夜一签 · 塔罗日签</title>

    <!-- 站点图标（第三十四轮补；三个文件都由 scripts/build_favicon.py 从牌背生成）
         · favicon.ico —— 浏览器标签页真正用的是它（内含 16/32/48 三档）。
           必须存在：**浏览器在 HTML 未声明 icon 时会自动请求 /favicon.ico**，缺了控制台会多一条 404。
         · icon.png 192×192 —— 高 DPI 与「添加到书签」场景。
         · apple-touch-icon —— iOS「添加到主屏幕」的图标。 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta
      name="description"
      content="每天一张塔罗牌。静心片刻，轻触水晶球，抽取属于今天的那一张大阿卡纳，看看它想对你说什么。"
    />
    <meta name="keywords" content="塔罗,日签,每日一签,塔罗牌,大阿卡纳,占卜" />

    <!-- 分享到微信 / 朋友圈 / 微博时的卡片信息。
         og:image 与 og:url 必须是**绝对地址**才能在抓取端生效（相对路径一律失效）。
         2026-09-22 上线 Netlify，域名定为 https://tarotdaily.netlify.app/ —— 换域名时
         只需改下面三行（og:image / og:url / twitter:image）与 canonical。
         图片由 scripts/build_og_cover.py 生成（1200×630）。 -->
    <link rel="canonical" href="https://tarotdaily.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="今夜一签" />
    <meta property="og:title" content="今夜一签 · 塔罗日签" />
    <meta
      property="og:description"
      content="每天一张塔罗牌。轻触水晶球，抽取属于今天的那一张大阿卡纳。"
    />
    <meta property="og:image" content="https://tarotdaily.netlify.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="今夜一签 · 塔罗日签" />
    <meta property="og:url" content="https://tarotdaily.netlify.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="今夜一签 · 塔罗日签" />
    <meta name="twitter:description" content="每天一张塔罗牌。轻触水晶球，抽取属于今天的那一张大阿卡纳。" />
    <meta name="twitter:image" content="https://tarotdaily.netlify.app/og-cover.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
